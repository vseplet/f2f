name: build

# Compile the f2f client for every target on each push / PR, so a break on a
# platform we don't develop on (Windows especially) is caught before release.
#
# f2f is pure Go — no cgo anywhere in source/helper — so every target
# cross-compiles from one Linux runner with CGO_ENABLED=0. No native runners,
# no toolchains. (Contrast with a cgo project, which needs a runner per OS.)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: arm64 } # Apple Silicon
          - { goos: windows, goarch: amd64, ext: .exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/helper/go.mod
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        working-directory: source/helper
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" \
            -o "${{ github.workspace }}/f2f-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: f2f-${{ matrix.goos }}-${{ matrix.goarch }}
          path: f2f-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error
