name: release

# Release on a v* tag: one binary per target, cross-compiled from a single
# Linux runner (f2f is pure Go, CGO_ENABLED=0). Also runnable by hand against a
# tag via workflow_dispatch.
#
# Packaging per OS:
#   linux / darwin — the bare binary (f2f-<os>-<arch>).
#   windows        — a zip, because the tunnel adapter needs wintun.dll beside
#                    the .exe at runtime (it's loaded lazily, not linked in). We
#                    ship the amd64 driver that's vendored in the repo.
#
# Targets: macOS arm64 (Apple Silicon), linux amd64 + arm64, windows amd64.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: arm64 } # Apple Silicon
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/helper/go.mod

      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: source/helper
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          go build -trimpath \
            -ldflags "-s -w -X main.version=$TAG" \
            -o "${{ github.workspace }}/f2f-$GOOS-$GOARCH$ext" .

      - name: Package
        id: pkg
        working-directory: ${{ github.workspace }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Wintun's Prebuilt Binaries License only permits distributing
          # wintun.dll ALONGSIDE software that uses its documented API — not as a
          # standalone file. So it isn't vendored in the repo; the release fetches
          # it from the vendor and ships it inside the zip next to f2f.exe (which
          # is exactly the "alongside" case the license allows). Version + hash
          # pinned so a swapped upstream artifact fails the build.
          WINTUN_VERSION: "0.14.1"
          WINTUN_SHA256: "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"
        run: |
          base="f2f-$GOOS-$GOARCH"
          if [ "$GOOS" = "windows" ]; then
            curl -fsSL "https://www.wintun.net/builds/wintun-${WINTUN_VERSION}.zip" -o wintun.zip
            echo "${WINTUN_SHA256}  wintun.zip" | sha256sum -c -
            unzip -j -o wintun.zip "wintun/bin/amd64/wintun.dll" -d .
            # The binary inside the zip is f2f.exe (the installed command is `f2f`);
            # the target tag lives on the zip name, not the exe.
            cp "$base.exe" f2f.exe
            zip -j "$base.zip" f2f.exe wintun.dll
            echo "asset=$base.zip" >> "$GITHUB_OUTPUT"
          else
            echo "asset=$base" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: ${{ steps.pkg.outputs.asset }}
          fail_on_unmatched_files: true
